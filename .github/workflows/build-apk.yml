name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Create Capacitor project
        run: |
          mkdir app && cd app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir www
          cp ../index.html ../manifest.webmanifest ../icon-192.png ../icon-512.png www/
          npx cap init "Daily Tracker" com.dailytracker.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: daily-tracker-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
